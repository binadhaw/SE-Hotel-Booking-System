# Test configuration: in-memory H2 instead of MySQL, so tests never touch real data.
spring.application.name=Hotel
spring.datasource.url=jdbc:h2:mem:hoteltest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=45MB
app.mail.enabled=false
spring.mail.host=localhost
app.demo-data=false
app.crypto.key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
