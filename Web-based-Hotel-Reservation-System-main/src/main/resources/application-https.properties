# ===================== HTTPS profile =====================
# Run with:  mvnw spring-boot:run -Dspring-boot.run.profiles=https   (or SPRING_PROFILES_ACTIVE=https)
# Create a development certificate once (not committed to git):
#   keytool -genkeypair -alias hotel -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore hotel-keystore.p12 -validity 365 -dname "CN=localhost"
# then set SSL_KEYSTORE_PASSWORD to the password you chose.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:hotel-keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=hotel
# Cookies only travel over HTTPS
server.servlet.session.cookie.secure=true
