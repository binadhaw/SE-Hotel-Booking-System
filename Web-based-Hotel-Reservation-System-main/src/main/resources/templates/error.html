<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Something went wrong')}">
    <title>Something went wrong</title>
</head>
<body>
<main class="app-content container my-5" style="max-width: 640px;">
    <div class="luxe-card p-5 text-center">
        <i class="bi fs-1 d-block mb-3 text-warning"
           th:classappend="${status == 404 ? 'bi-signpost-split' : (status == 403 ? 'bi-shield-lock' : 'bi-exclamation-triangle')}"></i>
        <h1 class="h3 fw-bold" th:text="${status == 404 ? 'Page not found' : (status == 403 ? 'Access denied' : 'Something went wrong')}">Something went wrong</h1>
        <p class="text-muted" th:if="${status == 404}">The page you are looking for does not exist or was moved.</p>
        <p class="text-muted" th:if="${status == 403}">Your account does not have permission to open this page.</p>
        <p class="text-muted" th:if="${status != 404 and status != 403}">
            An unexpected error occurred. Please try again; if it keeps happening, contact support.
        </p>
        <small class="text-muted d-block mb-4" th:text="${'Error ' + status}">Error 500</small>
        <div class="d-flex gap-2 justify-content-center">
            <a href="javascript:history.back()" class="btn btn-outline-dark rounded-pill px-4">Go back</a>
            <a th:href="@{/dashboard}" class="btn btn-luxe-gold rounded-pill px-4">Home</a>
        </div>
    </div>
</main>
</body>
</html>
