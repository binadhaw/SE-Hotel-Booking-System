<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Submit Inquiry')}">
    <title>Submit Inquiry &bull; Aura Grand Luxe Hotels</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('inquiries')}"></div>

<main class="app-content container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1 small">
                            <li class="breadcrumb-item"><a href="/inquiries" class="text-decoration-none text-muted">Inquiries</a></li>
                            <li class="breadcrumb-item active" aria-current="page">New Inquiry</li>
                        </ol>
                    </nav>
                    <h2 class="h3 fw-bold mb-0" th:text="${inquiry.id != null ? 'Edit inquiry ' + inquiry.displayTicket : 'Submit Guest Inquiry / Feedback'}">Submit Guest Inquiry / Feedback</h2>
                </div>
                <a href="/inquiries" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <div class="luxe-card shadow-sm">
                <div class="luxe-card-header dark py-3 px-4 d-flex align-items-center gap-2">
                    <i class="bi bi-chat-square-text-fill text-warning fs-5"></i>
                    <h5 class="mb-0 text-white fw-bold">Inquiry Message Form</h5>
                </div>
                <div class="luxe-card-body p-4 p-md-5">

                    <form th:action="${inquiry.id != null} ? @{/inquiries/{id}/update(id=${inquiry.id})} : @{/inquiries/save}" th:object="${inquiry}" method="post">

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="luxe-form-label">
                                    <i class="bi bi-person text-primary"></i> Your Name <span class="text-danger">*</span>
                                </label>
                                <input type="text" th:field="*{name}" class="form-control luxe-form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. John Doe" />
                                <div class="invalid-feedback" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="luxe-form-label">
                                    <i class="bi bi-envelope text-primary"></i> Email Address <span class="text-danger">*</span>
                                </label>
                                <input type="email" th:field="*{email}" class="form-control luxe-form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="name@example.com" />
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-4" sec:authorize="!hasRole('MANAGER')">
                            <label class="luxe-form-label" for="hotelId">
                                <i class="bi bi-building text-primary"></i> Send to
                            </label>
                            <select id="hotelId" name="hotelId" class="form-select luxe-form-control">
                                <option value="">Platform support (general question, account, payments)</option>
                                <option th:each="h : ${hotels}" th:value="${h.id}" th:selected="${selectedHotelId != null and selectedHotelId == h.id}"
                                        th:text="${h.name + ' - ' + h.location}"></option>
                            </select>
                            <div class="form-text">Questions about a stay go straight to that hotel's manager.</div>
                        </div>
                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-exclamation-circle text-warning"></i> Priority Level <span class="text-danger">*</span>
                            </label>
                            <select th:field="*{priority}" class="form-select luxe-form-control">
                                <option value="LOW">Low &mdash; General question or feedback</option>
                                <option value="MEDIUM">Medium &mdash; Standard booking query</option>
                                <option value="HIGH">High (Urgent) &mdash; Immediate assistance needed</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-bookmark-star text-secondary"></i> Subject <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{subject}" maxlength="150" class="form-control luxe-form-control"
                                   th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid' : ''" placeholder="Brief subject summary..." />
                            <div class="invalid-feedback" th:errors="*{subject}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-chat-left-dots text-secondary"></i> Message / Details <span class="text-danger">*</span>
                            </label>
                            <textarea th:field="*{message}" rows="4" maxlength="1000" class="form-control luxe-form-control"
                                      th:classappend="${#fields.hasErrors('message')} ? 'is-invalid' : ''" placeholder="Provide full details of your request or feedback..."></textarea>
                            <div class="invalid-feedback" th:errors="*{message}"></div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="/inquiries" class="btn btn-luxe-outline rounded-pill">Cancel</a>
                            <button type="submit" class="btn btn-luxe-gold rounded-pill px-4">
                                <i class="bi bi-send-fill me-1"></i> <span th:text="${inquiry.id != null ? 'Save changes' : 'Submit Inquiry'}">Submit Inquiry</span>
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
