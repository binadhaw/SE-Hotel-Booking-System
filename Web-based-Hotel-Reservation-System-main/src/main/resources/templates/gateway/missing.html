<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraPay &bull; Payment not found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/gateway.css}" rel="stylesheet" href="/css/gateway.css">
</head>
<body>
<header class="gw-top">
    <div class="gw-brand">
        <span class="gw-logo"><i class="bi bi-shield-lock-fill"></i></span>
        <span><strong>AuraPay</strong><small>Secure checkout</small></span>
    </div>
</header>
<main class="gw-missing">
    <div class="gw-otp-icon"><i class="bi bi-question-lg"></i></div>
    <h1>Payment not found</h1>
    <p class="gw-sub">This payment link is invalid or belongs to another account. You have not been charged.</p>
    <a th:href="@{/bookings}" class="gw-btn gw-btn-inline"><i class="bi bi-arrow-left"></i> Back to Aura Grand Luxe</a>
</main>
</body>
</html>
