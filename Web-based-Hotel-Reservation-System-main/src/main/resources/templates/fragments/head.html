<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B2A22">
    <meta name="description" content="Book verified hotels across Sri Lanka, check real-time availability, find local experiences and plan your trip with local travel experts.">
    <title th:text="${title} + ' &bull; Aura Grand Luxe'">Aura Grand Luxe</title>

    <!-- Fonts: Cormorant Garamond (display serif) + Jost (body) + Noto Sinhala/Tamil for the local greetings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600;700&family=Noto+Serif+Sinhala:wght@500&family=Noto+Sans+Tamil:wght@500&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 + icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- "Ceylon Emerald & Temple Gold" theme -->
    <link th:href="@{/css/style.css}" rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
</head>
<body>
</body>
</html>
