<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit Promotion')}">
    <title>Edit Promotion &bull; Aura Grand Luxe Hotels</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('promotions')}"></div>

<main class="app-content container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1 small">
                            <li class="breadcrumb-item"><a href="/promotions" class="text-decoration-none text-muted">Promotions</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Edit Promotion</li>
                        </ol>
                    </nav>
                    <h2 class="h3 fw-bold mb-0">Modify Promotion Campaign</h2>
                </div>
                <a href="/promotions" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <div class="luxe-card shadow-sm">
                <div class="luxe-card-header dark py-3 px-4 d-flex align-items-center gap-2">
                    <i class="bi bi-pencil-square text-warning fs-5"></i>
                    <h5 class="mb-0 text-white fw-bold">Edit Offer Configuration</h5>
                </div>
                <div class="luxe-card-body p-4 p-md-5">

                    <form th:action="@{/promotions/{id}/update(id=${promotion.id})}" th:object="${promotion}" method="post">

                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-tag text-primary"></i> Promo Code <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{code}" class="form-control luxe-form-control text-uppercase"
                                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''" required />
                            <div class="invalid-feedback" th:errors="*{code}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-card-text text-secondary"></i> Description <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{description}" class="form-control luxe-form-control"
                                   th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" required />
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-percent text-success"></i> Discount Percentage (%) <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="0.01" th:field="*{discountPercentage}" class="form-control luxe-form-control"
                                   th:classappend="${#fields.hasErrors('discountPercentage')} ? 'is-invalid' : ''" required />
                            <div class="invalid-feedback" th:errors="*{discountPercentage}"></div>
                        </div>

                        <div class="mb-4 p-4 bg-light rounded-3 border">
                            <h6 class="fw-bold text-dark mb-3 d-flex align-items-center gap-2">
                                <i class="bi bi-clock-history text-warning"></i> Recurring Timing Intervals
                            </h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="luxe-form-label">Cycle Interval (Minutes)</label>
                                    <input type="number" th:field="*{intervalMinutes}" class="form-control luxe-form-control" />
                                </div>
                                <div class="col-md-6">
                                    <label class="luxe-form-label">Active Display Duration (Minutes)</label>
                                    <input type="number" th:field="*{durationMinutes}" class="form-control luxe-form-control" />
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 p-3 bg-light rounded-3 border">
                            <div class="form-check form-switch m-0">
                                <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck" />
                                <label class="form-check-label fw-semibold text-dark ms-2" for="activeCheck">
                                    Active Promotion
                                </label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="/promotions" class="btn btn-luxe-outline rounded-pill">Cancel</a>
                            <button type="submit" class="btn btn-luxe-primary rounded-pill px-4">
                                <i class="bi bi-check2 me-1"></i> Update Promotion
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
