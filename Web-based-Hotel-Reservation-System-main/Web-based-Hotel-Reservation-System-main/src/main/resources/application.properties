spring.application.name=Hotel

# Secrets (database password, encryption key) live in src/main/resources/secrets.properties, which is NOT
# committed to git. Copy secrets.properties.example to secrets.properties and fill it in.
# Environment variables (DB_PASSWORD, CRYPTO_KEY...) override everything.
spring.config.import=optional:classpath:secrets.properties

# Server Configuration
server.port=8080

# ===================== MySQL Database Configuration =====================
# createDatabaseIfNotExist=true means Spring Boot will create the "hotel_db"
# schema automatically on first connection if it doesn't already exist,
# as a backup to the CREATE DATABASE statement you ran in Workbench.
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# The password comes from secrets.properties or the DB_PASSWORD environment variable.
spring.datasource.username=root
spring.datasource.password=Senuji@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# "update" will create any missing tables/columns automatically on startup -
# exactly like H2 did. Good for development and tomorrow's demo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
# Validation limits (@Size...) check the input, but must not shrink database columns: encrypted values
# (see app.crypto.key) are longer than the plain text they protect.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
# Performance: load lazy collections (each hotel's rooms and photos) for up to 50 hotels in one query
# instead of one query per hotel, so search and listings stay fast as the catalogue grows.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# File Upload Limits (payment receipts + hotel photos: up to 8 photos x 5MB each)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=45MB

# Errors are shown on the friendly templates/error pages; never leak stack traces to users
server.error.include-message=always
server.error.include-stacktrace=never

# ===================== Email =====================
# With app.mail.enabled=false emails are only written to the log (no SMTP server needed).
# To really send (e.g. Gmail): set MAIL_ENABLED=true, MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
# MAIL_USERNAME=<address>, MAIL_PASSWORD=<app password>.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@hotel.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# ===================== Demo data =====================
# Creates six showcase hotels (with rooms and photos) when the database has no hotels yet.
# Set DEMO_DATA=false to start with an empty catalogue.
app.demo-data=${DEMO_DATA:true}

# ===================== Data protection =====================
# AES-256 key (Base64, 32 bytes) used to encrypt personal data at rest (phone numbers, card holder names,
# inquiry and trip-request contact details). Set it in secrets.properties or the CRYPTO_KEY environment variable,
# e.g. generated with:  openssl rand -base64 32
# Keep the key safe: data encrypted with one key cannot be read with another.
app.crypto.key=${CRYPTO_KEY:}

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Behind a reverse proxy / Cloudflare Tunnel: trust X-Forwarded-Proto/-Host from the local proxy so redirects
# stay on https:// (Tomcat only trusts these headers from internal addresses such as 127.0.0.1)
server.forward-headers-strategy=native
