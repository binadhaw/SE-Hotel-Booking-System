<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Standard Discount')}">
    <title>Create Standard Discount &bull; Aura Grand Luxe Hotels</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('promotions')}"></div>

<main class="app-content container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1 small">
                            <li class="breadcrumb-item"><a href="/promotions" class="text-decoration-none text-muted">Promotions</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Seasonal Discount</li>
                        </ol>
                    </nav>
                    <h2 class="h3 fw-bold mb-0">Configure Seasonal Discount</h2>
                </div>
                <a href="/promotions" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <div class="luxe-card shadow-sm">
                <div class="luxe-card-header dark py-3 px-4 d-flex align-items-center gap-2">
                    <i class="bi bi-percent text-warning fs-5"></i>
                    <h5 class="mb-0 text-white fw-bold">Discount Details &amp; Validity Window</h5>
                </div>
                <div class="luxe-card-body p-4 p-md-5">

                    <form th:action="${promotion.id != null} ? @{/promotions/{id}/update(id=${promotion.id})} : @{/promotions}" th:object="${promotion}" method="post">
                        <div th:replace="~{fragments/alerts :: alerts}"></div>
                        <input type="hidden" th:field="*{type}" th:value="${T(com.Reservation.Hotel.model.Promotion.PromotionType).DISCOUNT}" />

                        <!-- Title / Description -->
                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-card-text text-primary"></i> Promotion Title / Description <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{description}" class="form-control luxe-form-control" placeholder="e.g. Summer Seaside Escape 15% Off" required />
                        </div>

                        <!-- Discount Percentage -->
                        <div class="mb-4">
                            <label class="luxe-form-label">
                                <i class="bi bi-percent text-success"></i> Discount Percentage (%) <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="0.01" th:field="*{discountPercentage}" min="1" max="90" class="form-control luxe-form-control" placeholder="e.g. 15" required />
                        </div>

                        <!-- Validity Period -->
                        <div class="mb-4 p-4 bg-light rounded-3 border">
                            <h6 class="fw-bold text-dark mb-3 d-flex align-items-center gap-2">
                                <i class="bi bi-calendar-range text-primary"></i>
                                Validity Date Range
                            </h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="luxe-form-label">Valid From</label>
                                    <input type="datetime-local" th:field="*{validFrom}" class="form-control luxe-form-control" />
                                </div>
                                <div class="col-md-6">
                                    <label class="luxe-form-label">Valid Until</label>
                                    <input type="datetime-local" th:field="*{validUntil}" class="form-control luxe-form-control" />
                                </div>
                            </div>
                        </div>

                        <div th:replace="~{promotions/scope-fields :: scope(false)}"></div>

                        <!-- Active Toggle -->
                        <div class="mb-4 p-3 bg-light rounded-3 border">
                            <div class="form-check form-switch m-0">
                                <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck" checked />
                                <label class="form-check-label fw-semibold text-dark ms-2" for="activeCheck">
                                    Activate Discount Immediately
                                </label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="/promotions" class="btn btn-luxe-outline rounded-pill">Cancel</a>
                            <button type="submit" class="btn btn-luxe-primary rounded-pill px-4">
                                <i class="bi bi-check2-circle me-1"></i> Save Discount
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
