<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Forgot password')}">
    <title>Forgot password</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<main class="app-content container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="luxe-card shadow-sm">
                <div class="luxe-card-header dark py-4 px-4">
                    <h5 class="text-white fw-bold mb-0"><i class="bi bi-key text-warning me-2"></i>Reset your password</h5>
                    <small class="text-white-50">Step 1 of 2 &mdash; find your account</small>
                </div>
                <div class="luxe-card-body p-4">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-4">
                            <label class="luxe-form-label" for="username"><i class="bi bi-person"></i> Username</label>
                            <input type="text" id="username" name="username" th:value="${username}" class="form-control luxe-form-control" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-luxe-gold w-100 rounded-pill">Continue</button>
                    </form>
                    <p class="text-center small mt-4 mb-0"><a th:href="@{/login}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to log in</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
