<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset password')}">
    <title>Reset password</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<main class="app-content container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="luxe-card shadow-sm">
                <div class="luxe-card-header dark py-4 px-4">
                    <h5 class="text-white fw-bold mb-0"><i class="bi bi-key text-warning me-2"></i>Reset your password</h5>
                    <small class="text-white-50">Step 2 of 2 &mdash; answer your security question</small>
                </div>
                <div class="luxe-card-body p-4">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>
                    <form th:action="@{/forgot-password/reset}" method="post">
                        <input type="hidden" name="username" th:value="${username}">
                        <div class="mb-3">
                            <label class="luxe-form-label">Account</label>
                            <div class="form-control-plaintext fw-semibold" th:text="${username}">user</div>
                        </div>
                        <div class="mb-3">
                            <label class="luxe-form-label" for="answer" th:text="${securityQuestion}">Question?</label>
                            <input type="text" id="answer" name="answer" class="form-control luxe-form-control" required autocomplete="off" autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="luxe-form-label" for="newPassword">New password</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control luxe-form-control" required minlength="8" autocomplete="new-password">
                            <div class="form-text">At least 8 characters, with letters and numbers.</div>
                        </div>
                        <div class="mb-4">
                            <label class="luxe-form-label" for="confirmPassword">Confirm new password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control luxe-form-control" required minlength="8" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-luxe-gold w-100 rounded-pill">Reset password</button>
                    </form>
                    <p class="text-center small mt-4 mb-0"><a th:href="@{/login}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to log in</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
