<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Activity log')}">
    <title>Activity log</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin_dashboard')}"></div>

<main class="app-content container my-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-list-ul text-warning me-2"></i>Activity log</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-dark btn-sm rounded-pill px-3"><i class="bi bi-arrow-left"></i> Dashboard</a>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <a th:href="@{/admin/activity}" class="btn btn-sm rounded-pill" th:classappend="${type == '' ? 'btn-dark' : 'btn-light'}">All</a>
        <a th:each="f : ${filters}" th:href="@{/admin/activity(type=${f})}" class="btn btn-sm rounded-pill"
           th:classappend="${type == f ? 'btn-dark' : 'btn-light'}" th:text="${#strings.capitalize(#strings.toLowerCase(f))}">Hotel</a>
    </div>

    <div class="luxe-table-container">
        <table class="luxe-table">
            <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead>
            <tbody>
            <tr th:each="a : ${logPage.content}">
                <td class="small text-nowrap" th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                <td class="small" th:text="${a.actor}">admin</td>
                <td class="small"><i class="bi me-1" th:classappend="${a.icon}"></i><span th:text="${a.actionLabel}"></span></td>
                <td class="small text-muted" th:text="${a.details}"></td>
            </tr>
            <tr th:if="${logPage.empty}"><td colspan="4" class="text-center text-muted py-4">Nothing recorded yet.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between mt-3" th:if="${logPage.totalPages > 1}">
        <a th:if="${logPage.hasPrevious()}" th:href="@{/admin/activity(type=${type}, page=${logPage.number - 1})}" class="btn btn-sm btn-outline-dark">&larr; Newer</a>
        <span class="small text-muted" th:text="${'Page ' + (logPage.number + 1) + ' of ' + logPage.totalPages}"></span>
        <a th:if="${logPage.hasNext()}" th:href="@{/admin/activity(type=${type}, page=${logPage.number + 1})}" class="btn btn-sm btn-outline-dark">Older &rarr;</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
