<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Payment receipt')}">
    <title>Payment receipt</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('bookings')}"></div>

<main class="app-content container my-5" style="max-width: 680px;">
    <div class="luxe-card p-4 p-md-5 text-center fade-up">
        <div class="pay-success-icon mx-auto mb-3"><i class="bi bi-check-lg"></i></div>
        <h1 class="h2 mb-1">Payment successful</h1>
        <p class="text-muted mb-4">Your booking is confirmed. A receipt has been sent to your email.</p>

        <div class="text-start border rounded-4 p-4 mb-4" style="background: var(--sand-50);">
            <div class="d-flex justify-content-between py-1"><span class="text-muted">Transaction</span><strong class="font-monospace" th:text="${payment.transactionId}">TXN</strong></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted">Amount paid</span><strong th:text="${'$' + #numbers.formatDecimal(payment.amount, 1, 'COMMA', 2, 'POINT')}">$0</strong></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted">Card</span><span th:text="${payment.cardLabel}">Visa 4242</span></div>
            <div class="d-flex justify-content-between py-1"><span class="text-muted">Date</span><span th:text="${#temporals.format(payment.createdAt, 'dd MMM yyyy, HH:mm')}">date</span></div>
            <div class="d-flex justify-content-between py-1">
                <span class="text-muted">Booking(s)</span>
                <span><span class="badge bg-light text-dark border font-monospace ms-1" th:each="r : ${references}" th:text="${r}">BK</span></span>
            </div>
        </div>

        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a th:href="@{/bookings}" class="btn btn-luxe-primary"><i class="bi bi-calendar-check"></i> View my bookings</a>
            <a th:href="@{/agents/explore}" class="btn btn-luxe-outline"><i class="bi bi-compass"></i> Plan activities with a local expert</a>
            <button type="button" class="btn btn-luxe-outline" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
